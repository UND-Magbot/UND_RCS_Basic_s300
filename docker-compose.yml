services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    environment:
      - TZ=Asia/Seoul
      - DB_HOST=${SERVER_IP:-192.168.0.44}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - DB_NAME=${DB_NAME:-rcs_basic_db}
    volumes:
      - ./BackEnd/static:/app/static
      - /home/administrator:/home/administrator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://192.168.0.44:8003}
    ports:
      - "3003:3003"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
